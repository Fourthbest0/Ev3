spring.application.name=RATE
server.port=${RATE_PORT:8080}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
spring.cloud.gateway.server.webmvc.routes[0].id=MS-A
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://MS-A
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/entity-a/**
spring.cloud.gateway.server.webmvc.routes[1].id=MS-B
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://MS-B
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/entity-b/**
