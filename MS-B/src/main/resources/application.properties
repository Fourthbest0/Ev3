spring.application.name=MS-B
server.port=${MSB_PORT:8082}
spring.datasource.url=${MSB_DB_URL:jdbc:h2:file:./data/msb;AUTO_SERVER=TRUE}
spring.datasource.username=${MSB_DB_USER:sa}
spring.datasource.password=${MSB_DB_PASSWORD:}
spring.datasource.driver-class-name=${MSB_DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${MSB_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===== Seguridad: Resource Server (JWT emitidos por el Authorization Server) =====
app.auth-server-url=${AUTH_SERVER_URL:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${app.auth-server-url}
# Orígenes permitidos por CORS (separar con comas si son varios)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.cloud.openfeign.client.config.MS-A.connectTimeout=3000
spring.cloud.openfeign.client.config.MS-A.readTimeout=5000
